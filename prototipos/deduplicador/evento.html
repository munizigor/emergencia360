<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos vinculados — Estação Integrada (Protótipo)</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script src="src/js/dados.js"></script>
  <script src="src/js/comum.js"></script>
  <script src="src/js/motor.js"></script>
  <script>document.documentElement.dataset.orgao = ESTADO.obterVerComo();</script>
</head>
<body>
  <div id="cabecalho"></div>

  <main>
    <h1 class="pagina-titulo">Eventos vinculados</h1>
    <p class="pagina-subtitulo">
      Cada evento reúne as ocorrências que diferentes órgãos declararam ser o mesmo fato. Nenhum
      registro de origem é alterado pelo vínculo — é o princípio P2 do documento de visão.
    </p>

    <div class="grid-evento">
      <section class="panel">
        <h2>Eventos com mais de uma ocorrência</h2>
        <div id="listaEventos" class="lista-eventos"></div>
      </section>

      <section class="panel" id="painelDetalheEvento">
        <h2 id="tituloEvento">Selecione um evento</h2>
        <div id="detalheEvento" class="grid-cartoes-evento"></div>
      </section>
    </div>
  </main>

  <script src="src/js/evento.js"></script>
</body>
</html>
